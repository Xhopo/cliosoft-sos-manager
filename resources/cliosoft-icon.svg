    <!-- 左侧S -->
    <path d="M50,15 C50,15 60,15 65,25 C70,35 65,45 65,45 C65,45 75,45 80,55 C85,65 80,75 80,75 C80,75 70,75 65,85 C60,95 50,95 50,95 C50,95 40,95 35,85 C30,75 35,65 35,65 C35,65 25,65 20,55 C15,45 20,35 20,35 C20,35 30,35 35,25 C40,15 50,15 50,15 Z" fill="white" />
    
