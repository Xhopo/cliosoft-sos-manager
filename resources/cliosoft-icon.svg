    <!-- 右侧S -->
    <path d="M230,15 C230,15 240,15 245,25 C250,35 245,45 245,45 C245,45 255,45 260,55 C265,65 260,75 260,75 C260,75 250,75 245,85 C240,95 230,95 230,95 C230,95 220,95 215,85 C210,75 215,65 215,65 C215,65 205,65 200,55 C195,45 200,35 200,35 C200,35 210,35 215,25 C220,15 230,15 230,15 Z" fill="white" />
