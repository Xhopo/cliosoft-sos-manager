  <!-- 装饰元素 -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="1" opacity="0.2" />
</svg>